name: Update README

on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC daily, off the hour to avoid the busiest minute
  workflow_dispatch: # also keeps the schedule alive during quiet spells

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install: update.py uses only the standard library.
      - run: python update.py

      - name: Commit if the block changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Update live block"
          git push
